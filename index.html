<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Tasks</title>

  <!-- Lato font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS (Play CDN). Dark mode is toggled by adding the "dark" class to <html> -->
    <link rel="stylesheet" href="./src/output.css">
    <link rel="stylesheet" href="./src/input.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { fontFamily: { lato: ['Lato', 'sans-serif'] } } },
    };
  </script>
</head>

<body class="min-h-screen flex font-lato bg-[#f3f4f6] text-[#333] dark:bg-[#101828] dark:text-white">

  <input id="menu-toggle" type="checkbox" class="peer sr-only" aria-label="Toggle sidebar" />

  <label for="menu-toggle" aria-hidden="true"
    class="fixed inset-0 z-30 hidden bg-black/50 peer-checked:block lg:peer-checked:hidden"></label>

  <aside
    id="sidebar"
    class="fixed inset-y-0 left-0 z-40 w-[300px] max-w-[85vw] overflow-y-auto -translate-x-full
           bg-white dark:bg-[#1e2939] shadow-[0_4px_12px_rgba(0,0,0,0.25)] transition-all duration-300
           peer-checked:translate-x-0
           lg:sticky lg:top-0 lg:h-screen lg:shrink-0 lg:translate-x-0 lg:w-[359px] lg:max-w-none
           lg:peer-checked:w-[130px]"
  >

    <label for="menu-toggle" role="button" aria-label="Toggle sidebar" class="absolute left-[49px] top-[45px] size-8 cursor-pointer">
      <svg class="size-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="4" x2="20" y1="12" y2="12" /><line x1="4" x2="20" y1="6" y2="6" /><line x1="4" x2="20" y1="18" y2="18" />
      </svg>
    </label>

    <!-- Profile (hidden in the collapsed rail) -->
    <div class="flex flex-col items-center pt-[105px] lg:peer-checked:hidden">
      <!-- Replace src with your own avatar image -->
      <img id="avatar" src="https://i.pravatar.cc/89?img=47" alt="Jane Doe" width="89" height="89" class="size-[89px] rounded-full object-cover" />
      <p id="profile-name" class="mt-7 text-2xl font-bold">Jane Doe</p>
      <p id="profile-email" class="mt-2 text-xl text-[#6a7282] dark:text-[#99a1af]">janedoe@gmail.com</p>
    </div>

    <hr class="mx-[34px] mt-[29px] border-t border-[#d1d5dc] dark:border-[#4a5565] lg:peer-checked:mx-[14px] lg:peer-checked:mt-[122px]" />

    <!-- Navigation -->
    <nav class="mt-9 px-[34px] space-y-7 lg:peer-checked:px-[13px]">
      <!-- Active item -->
      <a href="#" class="flex items-center gap-11 h-[58px] pl-[21px] rounded-xl bg-[#f3f4f6] text-[#333] lg:peer-checked:justify-center lg:peer-checked:pl-0">
        <svg class="size-8 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="6" height="6" rx="1" /><path d="m3 17 2 2 4-4" /><path d="M13 6h8" /><path d="M13 12h8" /><path d="M13 18h8" />
        </svg>
        <span class="text-2xl font-bold whitespace-nowrap lg:peer-checked:hidden">My Tasks</span>
      </a>

      <!-- Settings -->
      <a href="#" class="flex items-center gap-11 h-[58px] pl-[21px] rounded-xl lg:peer-checked:justify-center lg:peer-checked:pl-0">
        <svg class="size-8 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
          <circle cx="12" cy="12" r="3" />
        </svg>
        <span class="text-2xl font-bold whitespace-nowrap lg:peer-checked:hidden">Settings</span>
      </a>
    </nav>
  </aside>

  <!-- ===================== MAIN ===================== -->
  <div class="relative flex-1 min-w-0 flex flex-col items-center min-h-screen px-4 sm:px-6">

    <!-- Top bar: menu button (mobile/tablet only) + theme toggle -->
    <header class="absolute inset-x-0 top-0 flex items-center justify-between px-4 pt-4 sm:px-6 lg:px-10 lg:pt-[37px]">
      <label for="menu-toggle" role="button" aria-label="Open sidebar" class="size-9 cursor-pointer lg:hidden">
        <svg class="size-9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="4" x2="20" y1="12" y2="12" /><line x1="4" x2="20" y1="6" y2="6" /><line x1="4" x2="20" y1="18" y2="18" />
        </svg>
      </label>

      <!-- Theme toggle: moon shows in light mode, sun shows in dark mode (pure CSS swap) -->
      <button id="theme-toggle" type="button" aria-label="Toggle theme" class="ml-auto size-9 sm:size-12">
        <svg class="size-full dark:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
        </svg>
        <svg class="size-full hidden dark:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4" /><path d="M12 2v2" /><path d="M12 20v2" /><path d="m4.93 4.93 1.41 1.41" /><path d="m17.66 17.66 1.41 1.41" /><path d="M2 12h2" /><path d="M20 12h2" /><path d="m6.34 17.66-1.41 1.41" /><path d="m19.07 4.93-1.41 1.41" />
        </svg>
      </button>
    </header>

    <main class="w-full max-w-[689px] mt-20 sm:mt-24 lg:mt-[81px]">

      <h1 class="text-4xl sm:text-5xl font-bold leading-none">My Tasks</h1>

      <!-- Add task row -->
      <div class="mt-8 sm:mt-14 flex gap-3 sm:gap-[27px]">
        <input
          id="task-input"
          type="text"
          placeholder="Type your task here.."
          class="flex-1 min-w-0 h-12 sm:h-[59px] px-4 sm:px-[26px] text-lg sm:text-2xl rounded-xl bg-white text-[#333] placeholder-[#a9a9a9] shadow-[0_2px_4px_rgba(0,0,0,0.25)] outline-none focus:ring-2 focus:ring-black
                 dark:bg-[#364153] dark:text-white dark:border dark:border-[#4a5565] dark:focus:ring-white"
        />
        <button
          id="add-task-btn"
          type="button"
          class="h-12 sm:h-[59px] sm:w-[143px] shrink-0 px-4 sm:px-0 flex items-center justify-center gap-1 sm:gap-2 rounded-xl text-lg sm:text-2xl font-bold text-white bg-black shadow-[0_2px_4px_rgba(0,0,0,0.25)]
                 dark:bg-[#4a5565]"
        >
          <svg class="size-5 sm:size-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14" /><path d="M12 5v14" />
          </svg>
          Add
        </button>
      </div>

      <!-- Filter + counter -->
      <div class="mt-8 sm:mt-14 flex flex-wrap items-center justify-between gap-x-4 gap-y-1 text-base sm:text-xl text-[#6a7282]">
        <div id="filters" class="flex gap-2">
          <button type="button" data-filter="all" class="text-[#333] dark:text-white">All</button>
          <span>|</span>
          <button type="button" data-filter="active">Active</button>
          <span>|</span>
          <button type="button" data-filter="completed">Completed</button>
        </div>
        <p id="tasks-left"><span id="tasks-left-count">2</span> tasks left</p>
      </div>

      <!-- Task list -->
      <ul id="task-list" class="mt-4 sm:mt-6 space-y-4 sm:space-y-[30px]">

        <!-- Task (not completed) -->
        <li class="task flex items-center gap-4 min-h-[64px] sm:min-h-[84px] py-3 pl-4 pr-4 sm:pl-[26px] sm:pr-[35px] rounded-xl bg-white shadow-[0_2px_4px_rgba(0,0,0,0.25)] dark:bg-[#1e2939]">
          <label class="relative flex flex-1 min-w-0 items-center gap-4 sm:gap-[30px] cursor-pointer">
            <input type="checkbox" class="peer sr-only" />
            <span class="size-6 shrink-0 rounded-[4px] border-2 border-black dark:border-white peer-checked:bg-black dark:peer-checked:bg-white"></span>
            <svg class="pointer-events-none absolute left-0 size-6 p-[3px] text-white dark:text-[#101828] opacity-0 peer-checked:opacity-100" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 6 9 17l-5-5" />
            </svg>
            <span class="task-text min-w-0 break-words text-lg sm:text-2xl peer-checked:line-through peer-checked:text-[#6a7282]">Learn React</span>
          </label>
          <div class="flex shrink-0 items-center gap-4 sm:gap-7">
            <button type="button" aria-label="Edit task" class="edit-btn">
              <svg class="size-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z" /><path d="m15 5 4 4" />
              </svg>
            </button>
            <button type="button" aria-label="Delete task" class="delete-btn">
              <svg class="size-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 6h18" /><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" /><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" /><line x1="10" x2="10" y1="11" y2="17" /><line x1="14" x2="14" y1="11" y2="17" />
              </svg>
            </button>
          </div>
        </li>

        <!-- Task (completed: checkbox has the "checked" attribute) -->
        <li class="task flex items-center gap-4 min-h-[64px] sm:min-h-[84px] py-3 pl-4 pr-4 sm:pl-[26px] sm:pr-[35px] rounded-xl bg-white shadow-[0_2px_4px_rgba(0,0,0,0.25)] dark:bg-[#1e2939]">
          <label class="relative flex flex-1 min-w-0 items-center gap-4 sm:gap-[30px] cursor-pointer">
            <input type="checkbox" class="peer sr-only" checked />
            <span class="size-6 shrink-0 rounded-[4px] border-2 border-black dark:border-white peer-checked:bg-black dark:peer-checked:bg-white"></span>
            <svg class="pointer-events-none absolute left-0 size-6 p-[3px] text-white dark:text-[#101828] opacity-0 peer-checked:opacity-100" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 6 9 17l-5-5" />
            </svg>
            <span class="task-text min-w-0 break-words text-lg sm:text-2xl peer-checked:line-through peer-checked:text-[#6a7282]">Prototyping To-Do List</span>
          </label>
          <div class="flex shrink-0 items-center gap-4 sm:gap-7">
            <button type="button" aria-label="Edit task" class="edit-btn">
              <svg class="size-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z" /><path d="m15 5 4 4" />
              </svg>
            </button>
            <button type="button" aria-label="Delete task" class="delete-btn">
              <svg class="size-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 6h18" /><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" /><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" /><line x1="10" x2="10" y1="11" y2="17" /><line x1="14" x2="14" y1="11" y2="17" />
              </svg>
            </button>
          </div>
        </li>

        <li class="task flex items-center gap-4 min-h-[64px] sm:min-h-[84px] py-3 pl-4 pr-4 sm:pl-[26px] sm:pr-[35px] rounded-xl bg-white shadow-[0_2px_4px_rgba(0,0,0,0.25)] dark:bg-[#1e2939]">
          <label class="relative flex flex-1 min-w-0 items-center gap-4 sm:gap-[30px] cursor-pointer">
            <input type="checkbox" class="peer sr-only" />
            <span class="size-6 shrink-0 rounded-[4px] border-2 border-black dark:border-white peer-checked:bg-black dark:peer-checked:bg-white"></span>
            <svg class="pointer-events-none absolute left-0 size-6 p-[3px] text-white dark:text-[#101828] opacity-0 peer-checked:opacity-100" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 6 9 17l-5-5" />
            </svg>
            <span class="task-text min-w-0 break-words text-lg sm:text-2xl peer-checked:line-through peer-checked:text-[#6a7282]">Push to Github</span>
          </label>
          <div class="flex shrink-0 items-center gap-4 sm:gap-7">
            <button type="button" aria-label="Edit task" class="edit-btn">
              <svg class="size-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z" /><path d="m15 5 4 4" />
              </svg>
            </button>
            <button type="button" aria-label="Delete task" class="delete-btn">
              <svg class="size-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 6h18" /><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" /><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" /><line x1="10" x2="10" y1="11" y2="17" /><line x1="14" x2="14" y1="11" y2="17" />
              </svg>
            </button>
          </div>
        </li>

      </ul>
    </main>

    <footer class="mt-auto py-8 sm:py-10 text-base sm:text-xl text-[#6a7282]">© 2025</footer>

    <script src="./JS/script.js"></script>
  </div>

</body>
</html>
